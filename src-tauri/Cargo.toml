[package]
name = "deetsairplay"
version = "0.1.2"
description = "Tray AirPlay 2 sender for Windows: system audio to a HomePod, hand-rolled protocol."
authors = ["Aditya Sundaram"]
edition = "2021"
# Two binaries (the app + the probe); `tauri dev` runs a bare `cargo run`.
default-run = "deetsairplay"

[lib]
# The `_lib` suffix keeps the lib name unique against the bin name on Windows
# (same reason as DeetsMusic/DeetsRGB; see rust-lang/cargo#8519).
name = "deetsairplay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "deetsairplay"
path = "src/main.rs"

# The desk probe: discover, pair, and play a tone / the loopback capture from
# a console, with every RTSP exchange logged. Run before touching the UI.
[[bin]]
name = "probe"
path = "src/bin/probe.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The sender itself (mDNS, RTSP, pairing, ALAC/RTP, WASAPI capture) is the
# shared crate under ../crates/airplay; DeetsMusic depends on the same crate by git.
deets-airplay = { path = "../crates/airplay" }

# OS bindings the APP needs on top of the crate: the Windows media session and
# media keys (media.rs).
[dependencies.windows]
version = "0.61"
features = [
  "Foundation",
  "Media_Control",
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
]

[profile.release]
opt-level = 3
